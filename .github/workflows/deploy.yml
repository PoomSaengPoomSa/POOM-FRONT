name: Deploy POOM-FRONT
on:
  push:
    branches:
      - main
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/poomsaengpoomsa/poom-front:latest
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to FRONT server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FRONT_SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.BASTION_HOST }}
          proxy_username: ${{ secrets.SERVER_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 10m
          envs: GHCR_TOKEN
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u poomsaengpoomsa --password-stdin
            docker pull ghcr.io/poomsaengpoomsa/poom-front:latest
            docker stop poom-front || true
            docker rm poom-front || true
            docker run -d \
              --name poom-front \
              --restart unless-stopped \
              -p 80:80 \
              ghcr.io/poomsaengpoomsa/poom-front:latest
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
